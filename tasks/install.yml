---
- name: Install requisite pip (likely present)
  apt:
    name:
      - python3-pip
      - python3-setuptools
      - python3
      - python3-hvac
    state: present
    force_apt_get: yes
    cache_valid_time: 84600
  become: yes
  become_user: root

- name: Check if wireguard is installed
  stat:
    path: "{{ wireguard_binary }}"
  register: wg_bin
- sysctl:
    name: net.ipv4.ip_forward
    value: 1
    state: present
    sysctl_file: /etc/sysctl.d/99-mkrasberry.conf
- sysctl:
    name: net.core.default_qdisc
    value: fq
    state: present
    sysctl_file: /etc/sysctl.d/99-mkrasberry.conf
- sysctl:
    name: net.ipv4.tcp_congestion_control
    value: bbr
    state: present
    sysctl_file: /etc/sysctl.d/99-mkrasberry.conf

- name: Disable reverse-path filtering for WireGuard routing interfaces
  sysctl:
    name: "net.ipv4.conf.{{ item }}.rp_filter"
    value: 0
    state: present
    sysctl_file: /etc/sysctl.d/99-mkrasberry.conf
  loop:
    "{{ ['all', 'default', wireguard_source_routing_lan_interface, wireguard_client_interface, wireguard_server_interface] | unique | list }}"
  when:
    - wireguard_source_routing_enabled | bool
    - item in ['all', 'default'] or item in ansible_facts.get('interfaces', [])


- name: Install Wireguard Binary
  block:
#    - name: Add testing branch so we can get wireguard installer
#      apt_repository:
#        repo: deb http://raspbian.raspberrypi.org/raspbian/ testing main contrib non-free rpi
#        state: present
#        update_cache: yes
    - name: Install requisite packages (likely present)
      apt:
        name:
          - wireguard
        state: present
        force_apt_get: yes
        cache_valid_time: 84600
      register: wireguard_packages_present
#    - name: Remove testing branch so we don't get accidental surpises
#      apt_repository:
#        repo: deb http://raspbian.raspberrypi.org/raspbian/ testing main contrib non-free rpi
#        state: absent
#        update_cache: yes
    - name: Check if wireguard directory exists
      stat:
        path: "{{ wireguard_remote_directory }}"
      register: wg_dir

    - name: create wireguard directory if not exists
      file:
        path: "{{ wireguard_remote_directory }}"
        state: directory
        owner: "root"
        group: "root"
        mode: 0700
      when:
        wg_dir.stat.exists == False
      register: created_wg_dir

  when:
    wg_bin.stat.exists == False or force_install is defined
  tags: wireguard_install_binary

- name: Validate WireGuard source routing settings
  assert:
    that:
      - wireguard_source_routing_gateway is defined
      - wireguard_source_routing_gateway | length > 0
      - wireguard_source_routing_gateway is match('^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$')
      - wireguard_source_routing_lan_interface is match('^[A-Za-z0-9_.:-]+$')
      - wireguard_source_routing_table | string is match('^(0|[1-9][0-9]*)$')
      - wireguard_source_routing_priority | string is match('^(0|[1-9][0-9]*)$')
      - wireguard_source_routing_remote_subnets | length > 0
      - wireguard_source_routing_remote_subnets | select('match', '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])/([0-9]|[12][0-9]|3[0-2])$') | list | length == wireguard_source_routing_remote_subnets | length
    fail_msg: "wireguard_source_routing_enabled requires wireguard_source_routing_gateway and wireguard_source_routing_remote_subnets"
  when: wireguard_source_routing_enabled | bool
  tags: wireguard_install_binary

- name: Install WireGuard source routing helper
  template:
    src: wireguard-source-routes.j2
    dest: "{{ wireguard_source_routing_script }}"
    owner: root
    group: root
    mode: "0755"
  when: wireguard_source_routing_enabled | bool
  tags: wireguard_install_binary
