---
#######################################
# General settings
#######################################

# Directory to store WireGuard configuration on the remote hosts
wireguard_remote_directory: "/etc/wireguard"

# The default port WireGuard will listen if not specified otherwise.
wireguard_port: "51820"

# The default interface name that wireguard should use if not specified otherwise.
wireguard_client_interface: "wg1"
wireguard_server_interface: "wg0"


#######################################
# Settings only relevant for Ubuntu
#######################################

# Set to "false" if package cache should not be updated
wireguard_ubuntu_update_cache: "true"

# Set package cache valid time
wireguard_ubuntu_cache_valid_time: "3600"

wireguard_binary: "/usr/bin/wg"


refresh_wg_server: false
provision_wg_server: False
provision_wg_client: False
add_wg_client: False

# Enables source-policy routing for WireGuard site gateways. Keep disabled for
# ordinary clients; gateway hosts opt in with their local router and routed LANs.
wireguard_source_routing_enabled: false
wireguard_source_routing_script: "/usr/local/sbin/wireguard-source-routes"
wireguard_source_routing_table: 100
wireguard_source_routing_priority: 1000
wireguard_source_routing_lan_interface: "eth0"
wireguard_source_routing_remote_subnets: []
